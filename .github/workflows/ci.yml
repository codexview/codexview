name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @codexview/runtime... build

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm test:packages

      - run: node --test scripts/auto-release.test.mjs scripts/release-dispatch.test.mjs scripts/verify-release-tag.test.mjs
