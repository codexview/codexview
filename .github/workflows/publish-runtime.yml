name: Publish @codexview/runtime

# Publishes @codexview/runtime to npm via OIDC trusted publishing
# (no long-lived NPM_TOKEN secret required).
#
# Trigger: push a tag matching runtime-v*.*.* (e.g. runtime-v0.1.1).
# Release through packages/runtime/release.sh after merging to main.
#
# Set up trusted publishing once at npmjs.com:
#   Package @codexview/runtime → Settings → Trusted Publishers → Add → GitHub Actions
#     repo:        codexview/codexview
#     workflow:    publish-runtime.yml
#     environment: (leave blank)

on:
  push:
    tags: ['runtime-v*.*.*']
  workflow_dispatch:

permissions:
  contents: write   # for softprops/action-gh-release to create the GitHub release
  id-token: write   # required for OIDC token exchange with npm

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24    # ships with npm 11+ — required for OIDC trusted publishing
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches packages/runtime/package.json version
        run: bash scripts/verify-release-tag.sh runtime

      - name: Build @codexview/adapters (runtime depends on it)
        working-directory: packages/adapters
        run: pnpm build

      - name: Typecheck runtime
        working-directory: packages/runtime
        run: pnpm typecheck

      - name: Test runtime
        working-directory: packages/runtime
        run: pnpm test

      - name: Build runtime
        working-directory: packages/runtime
        run: pnpm build

      - name: Publish @codexview/runtime with provenance
        # pnpm rewrites workspace dependencies to published versions.
        working-directory: packages/runtime
        run: pnpm publish --provenance --access public --no-git-checks

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
